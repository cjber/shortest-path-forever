name: Speedpatrol

# Times this PR against its base branch in alternating A/B rounds on one runner, comments the table on the PR and
# fails on a regression. Only the planner benches run here.
on:
  pull_request:
    # labeled re-runs the timing when the "speedpatrol: accept" label is added; naming types replaces the defaults.
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speedpatrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_CORE: forever-core
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - uses: agent-labs-dev/speedpatrol@6f86e2ea61e004c78c18de41ad052c9f55ab5a19 # v0
        with:
          benchmarks: planner.journey planner.hearth
          fail-on-regression: true
          rounds: 3
          package: speedpatrol@0.2.0
