name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deadcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Every tool version lives in this checkout's tools/toolchain.json, which the action reads and installs and
      # verifies each pin from.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        id: toolchain
        with:
          tools: lua stylua
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: luacheck .
      - run: python3 -m tools.forever_tools.assets
      - run: python3 tools/check_api_docs.py
      - run: python3 -m tools.forever_tools.specs
      # The native client simulator: real Blizzard UI under LuaJIT with the full TOC, failing on errors and
      # gamepad-interface taint. Its UI source and client data are fetched at a pinned build and cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/sync.py check
      - run: python3 tools/forever_sim/fetch.py
      - run: luajit tools/forever_sim/run.lua
      # A screenshot older than the code it is drawn from (docs/screenshots/scenes.sha256).
      - run: python3 tools/check_screenshots.py
      - run: luajit -joff tests/runtime_bench.lua cold
      - run: luajit -joff tests/hearth_savings_bench.lua
      - run: luajit -joff tests/journey_bench.lua
      - run: tests/ui.sh
      - run: stylua --check .
      - run: uv run --project tools --frozen --group dev ruff check .
      - run: uv run --project tools --frozen --group dev ruff format --check .
      - run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck tools/baker/bake.sh tools/typecheck.sh tools/fetch_blizzard_ui.sh tests/ui.sh
      - run: pipx run --spec shfmt-py==4.2.0 shfmt -d tools/baker/bake.sh tools/typecheck.sh tools/fetch_blizzard_ui.sh tests/ui.sh

  bake-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest tools.bake_inputs_test tools.bake_tiles_test tools.gen_nav_test

  bake-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libboost-all-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev
      # ccache hashes every compile's preprocessed input and flags, so a hit is the same object a full compile makes;
      # every source still goes through the compiler step, which is what this job proves.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: bake-native-ccache-${{ hashFiles('tools/baker/bake.sh', 'tools/baker/*.patch') }}
          restore-keys: bake-native-ccache-
      - name: Build pinned terrain tools without a game install
        env:
          BUILD_ONLY: 1
          OUT: ${{ runner.temp }}/terrain
          JOBS: 4
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: tools/baker/bake.sh

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - run: python3 tools/check_generated.py
      # The walking maps name the baker pins and generator code they came from; fails when either moved.
      - run: python3 tools/check_nav.py
      # Data/Credits.lua and the README and store thanks blocks are generated from THIRD_PARTY.md (WFA-31).
      - run: python3 tools/forever_tools/credits.py --check

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # tools/check_locales.py parses each translation with LuaJIT.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        id: toolchain
        with:
          tools: lua luals
      - run: tools/typecheck.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: gitleaks
      - name: gitleaks
        run: gitleaks git --redact --no-banner .

  project-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release publishes its changelog entry, so every tagged version needs one.
      - run: python3 tools/changelog.py --check
      - env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 tools/repo_rules.py --base "origin/$BASE"

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --project tools --frozen --group dev actionlint
      - run: uv run --project tools --frozen --group dev zizmor --offline .github

  # What a tag would ship, checked before it ships: the release workflow's packager without uploading or zipping,
  # then tools/check_package.py on .release/ (every loaded file present, no development folders, specs pass on it).
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Every commit and tag for the version, without old file contents.
          filter: blob:none
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua
      # .pkgmeta's manual changelog, which the release fills with the version's entry.
      - run: printf 'Package check\n' > .release-notes.md
      # The packager skips a push build when HEAD carries a tag ("Found future tag, not packaging"), so a tag that
      # lands while this run is in flight would fail this job and leave main without the green run a release starts
      # from. This job checks what a tag would ship, so hide HEAD's tags and let the dry run build what an ordinary
      # push to main builds.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/fetch.py
      - run: python3 tools/check_package.py
