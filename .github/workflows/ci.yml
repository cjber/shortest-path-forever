name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The data refresh dispatches CI on the branch of the PR it opens.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y luajit lua-check
      - run: luacheck .
      - run: for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      # A screenshot older than the code it is drawn from (docs/screenshots/scenes.sha256).
      - run: python3 tools/check_screenshots.py
      - run: luajit -joff tests/runtime_bench.lua cold
      - run: luajit -joff tests/hearth_savings_bench.lua
      - name: Native tracker integration
        run: |
          python3 tools/fetch_tracker_ui.py
          TRACKER_UI_ROOT=tools/.cache/tracker-ui luajit tests/tracker_host_spec.lua
      - run: tests/ui.sh
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - run: pipx run ruff==0.16.8 check .
      - run: pipx run ruff==0.16.8 format --check .
      - run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck tools/baker/bake.sh tools/typecheck.sh tools/fetch_blizzard_ui.sh tests/ui.sh
      - run: pipx run --spec shfmt-py==4.2.0 shfmt -d tools/baker/bake.sh tools/typecheck.sh tools/fetch_blizzard_ui.sh tests/ui.sh

  bake-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest tools.bake_inputs_test tools.bake_tiles_test

  bake-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-all-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev
      - name: Build pinned terrain tools without a game install
        env:
          BUILD_ONLY: 1
          OUT: ${{ runner.temp }}/terrain
          JOBS: 2
        run: tools/baker/bake.sh

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - run: python3 tools/check_generated.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/check_locales.py parses each translation with LuaJIT.
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: lua-language-server
        env:
          LUALS_VERSION: 3.19.1
          LUALS_SHA256: e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8
        run: |
          curl -fsSLo luals.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  luals.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/luals" && tar -xzf luals.tar.gz -C "$RUNNER_TEMP/luals" && rm luals.tar.gz
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - run: tools/typecheck.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks && rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  sift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release publishes its changelog entry, so every tagged version needs one.
      - run: python3 tools/changelog.py --check
      - env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 .sift/gate.py --base "origin/$BASE"
      - run: python3 .sift/agents.py check

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      - run: pipx run zizmor==1.30.1 --offline .github

  # What a tag would ship, checked before it ships: the release workflow's packager without uploading or zipping,
  # then tools/check_package.py on .release/ (every loaded file present, no development folders, specs pass on it).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y luajit
      # .pkgmeta's manual changelog, which the release fills with the version's entry.
      - run: printf 'Package check\n' > .release-notes.md
      # The packager skips a push build when HEAD carries a tag ("Found future tag, not packaging"), so a tag that
      # lands while this run is in flight would fail this job and leave main without the green run a release starts
      # from. This job checks what a tag would ship, so hide HEAD's tags and let the dry run build what an ordinary
      # push to main builds.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d -z
      - run: python3 tools/check_package.py
