name: ci-approve
on:
  push:
    branches:
      - ci-approve/**
permissions:
  actions: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve pending pull request run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/cjber/shortest-path-forever/actions/runs/39910636562/approve
