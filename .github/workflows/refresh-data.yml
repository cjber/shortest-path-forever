name: Refresh game data

# Opens a PR with regenerated travel data when wago.tools lists a newer Forever build or the InFlight addon
# publishes new flight times. The route specs run here first; GitHub holds the CI of a PR that GITHUB_TOKEN opened,
# so the ci job approves it.
# Daily: beta builds have shipped several times a week. A failed run on main reports itself as an issue.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_CORE: forever-core
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Pinned inputs CI already downloaded, such as frozen dumps; each file is keyed by its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - name: Pin the newest Forever build and InFlight flight times
        id: pins
        run: python3 tools/refresh_pins.py
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        if: steps.pins.outputs.changed == 'true'
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - name: Regenerate
        if: steps.pins.outputs.changed == 'true'
        run: |
          python3 tools/gen_routes.py
          python3 tools/gen_transit.py
          luajit tools/bake_walks.lua > "$RUNNER_TEMP/Walks.lua"
          mv "$RUNNER_TEMP/Walks.lua" Data/Walks.lua
          python3 tools/pack_nav.py
          python3 tools/phrases.py > "$RUNNER_TEMP/phrases.txt"
          mv "$RUNNER_TEMP/phrases.txt" Locales/phrases.txt
      - if: steps.pins.outputs.changed == 'true'
        run: python3 tools/check_generated.py --offline
      - name: Lua checks, route specs and the hearth plan
        if: steps.pins.outputs.changed == 'true'
        run: |
          luacheck .
          python3 -m tools.forever_tools.specs
          luajit -joff tests/hearth_savings_bench.lua
      - if: steps.pins.outputs.changed == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.pins.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: data/refresh
          title: "data: refresh travel data"
          commit-message: "data: refresh travel data (${{ steps.pins.outputs.summary }})"
          body: |
            Regenerated `Data/*.lua` after moving the pins: ${{ steps.pins.outputs.summary }}.

            Before merging, read the diffs of `Data/Routes.lua` and `Data/Transports.lua` for boats, zeppelins, lifts or trams that appeared, moved or dropped out, `Data/Taxi.lua` for flight points and flight times, and `Data/Portals.lua` and `Data/Teleports.lua` for entries that dropped out. The route specs passed on this data, so a changed journey would have failed the run. Add a `CHANGELOG.md` line under Unreleased saying what a player would notice.

            The workflow that opened this PR also approved its CI, so the required checks run without a maintainer's approval.

  # GitHub holds every pull_request run on a PR that GITHUB_TOKEN opened until someone with write access approves
  # it: the held run has no jobs and no log, and it ends as a failure when the PR closes. Approve the PR commit's held
  # runs (CI and Speedpatrol) so its required checks run on their own. GitHub creates them a few seconds after the push.
  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Approve the PR's held workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          for _ in $(seq 30); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.id) \(.conclusion)"')
            held=$(printf '%s\n' "$runs" | awk '$2 == "action_required" { print $1 }')
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              echo "Approved run $id"
            done
            if [ -n "$runs" ] && [ -z "$held" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The pull_request runs for $SHA were not created or not approved"
          exit 1

  # One open issue at most: a later failure comments on it instead of opening another.
  report:
    needs: [refresh, ci]
    # The first attempt stays quiet: retry-refresh.yml re-runs it, and only a failed re-run is reported.
    if: failure() && github.run_attempt > 1 && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Data refresh failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --body "The scheduled data refresh failed, so the bundled travel data may be behind the client: $RUN_URL

          \`AGENTS.md\` describes the refresh. Close this once a run passes."
          fi
