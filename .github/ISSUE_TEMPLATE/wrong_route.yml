name: Wrong route
description: A journey goes the wrong way, misses a faster way, waits for the wrong boat, or can't find a way at all.
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: /path report
      description: >-
        While the journey is still on screen, type `/path report`, press Ctrl+C (Cmd+C on a Mac) and paste it here.
        It has your versions, where you are, the journey with each of its steps, why a walk failed, your ride and
        any errors. For a boat, zeppelin, lift or tram that was wrongly timed, type `/path debug` until chat says
        "debug on", ride it, and take the report: it adds the last samples from aboard. Then type `/path debug` again
        until it says "debug off", as it keeps sampling while on. On a version without `/path report`, give the
        addon version from the AddOns list and the output of `/dump GetBuildInfo()` instead.
      render: text
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: Where you started
      description: >-
        The zone and roughly where, if the journey has moved on since (the report shows where you are now).
      placeholder: Stormwind, by the Deeprun Tram
  - type: dropdown
    id: problem
    attributes:
      label: What's wrong
      options:
        - It walks into a wall, off a cliff or through water it shouldn't
        - There's a faster way it doesn't take
        - It takes a flight, boat, portal or teleport I can't use
        - The departure time or wait is wrong
        - It says there's no way there
        - Something else
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: >-
        The way you would have gone, or what the time should be. For a spot where the walk goes wrong, its map
        coordinates (from a coordinates addon or the world map) help.
    validations:
      required: true
