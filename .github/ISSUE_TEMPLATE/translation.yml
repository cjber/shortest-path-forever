name: Translation
description: Paste corrected or new translations and I'll add them.
labels: [enhancement]
body:
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - deDE
        - esES
        - esMX
        - frFR
        - koKR
        - ptBR
        - ruRU
        - zhCN
        - zhTW
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Locales file
      description: >-
        The lines you corrected from `Locales/<locale>.lua`, or your copy of `Locales/phrases.txt` with the right-hand
        sides translated. Lines you leave out stay as they are.
      render: lua
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything worth knowing, such as phrases you weren't sure about.
