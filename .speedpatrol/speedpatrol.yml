# Speedpatrol: https://github.com/agent-labs-dev/speedpatrol
# Commit this file and instructions.md. runs/ is local data.
version: 1
project:
  name: shortest-path-forever
  source: .
app:
  # Each side loads the ForeverCore its own tools/forever-core.txt pins: CI checks out only the PR's pin, so the
  # base checkout gets its own here, where the harness looks first (cjber/skillup-forever#550).
  prepare:
    - run: '[ -f forever-core/ForeverCore.toc ] || git -c advice.detachedHead=false clone -q --depth 1 --branch "$(cat tools/forever-core.txt)" https://github.com/cjber/forever-core forever-core'
  setup: []
  env: {}
  secrets: []
defaults:
  iterations: 7
  warmup: 1
benchmarks:
  # The planner's own benches, run headless. journey_bench exits non-zero when a journey does not
  # settle into one committed route. These are wall times, so
  # luajit's own startup is in the number: the threshold is loose on purpose, and a change worth
  # keeping is one that also passes the repo gate.
  - id: planner.journey
    kind: command
    run: luajit -joff tests/journey_bench.lua
    tags: [planner]
  - id: planner.hearth
    kind: command
    run: luajit -joff tests/hearth_savings_bench.lua
    tags: [planner]
thresholds:
  relative: 0.10
  absolute: 2
agents:
  scout: { use: claude }
  analyst: { use: claude }
  optimizer: { use: claude, enabled: false }
  github: { enabled: false }
  patrol: { intervalMinutes: 30, pull: origin/main }
