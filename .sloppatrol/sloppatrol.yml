# Sloppatrol profile for Shortest Path Forever, a WoW: Forever addon in Lua 5.1 with Python tooling.
# The checks are the fast ones from AGENTS.md, set by hand: the repo has no package.json to infer
# them from. `check_generated.py --offline` is left out: it needs
# the gitignored tools/.cache, which a clean run checkout does not have, and refactors skip Data/.
agent: claude
prepare: []
cleanup: [stylua .]
checks:
  - { name: format, run: "stylua --check ." }
  - { name: lint, run: "luacheck ." }
  - { name: typecheck, run: "tools/typecheck.sh" }
  - { name: specs, run: "for s in tests/*_spec.lua; do luajit \"$s\" || exit 1; done", tests: true }
  - { name: tools, run: "ruff format --check . && ruff check ." }
  - { name: rules, run: "python3 tools/repo_rules.py" }
focus: [Journey/**, Nav/**, Routing/**, Transport/**, UI/**]
ignore: [Data/**, Locales/**, Libs/**, tools/forever_tools/**, tools/forever_sim/**]
guards: { maxFiles: 8, maxLines: 400 }
